<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>攻撃モーション図鑑 | ルナネコカードアリーナ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11152b;color:#f5f3ff;font:16px system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:28px 20px}header{background:radial-gradient(ellipse at 20% 0,#403461,transparent 65%)}h1{font-size:clamp(25px,4vw,42px);margin:6px 0}p{color:#c4c8e0;line-height:1.6}.eyebrow{color:#ffcd70;font-weight:800;letter-spacing:.12em}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button,a{font:inherit}input,select{background:#242a43;color:white;border:1px solid #555e7c;border-radius:10px;padding:12px}input{min-width:190px;flex:1}button{border:0;border-radius:10px;padding:10px 15px;background:#ffc567;color:#251708;font-weight:800;cursor:pointer}button:hover{background:#ffdf95}button:disabled{opacity:.5;cursor:default}button.secondary{background:#333952;color:white}a{color:#ffd887}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.entry{border:1px solid #454562;background:#21243b;border-radius:18px;overflow:hidden;padding:16px;box-shadow:0 9px 22px #08091944}.name{display:flex;align-items:center;gap:12px}.original{width:44px;height:44px;object-fit:cover;border-radius:50%;border:2px solid #8e86b1}.name b{display:block;font-size:17px}.name small{color:#b9bfd5}.stage{height:220px;background:radial-gradient(ellipse,#45445f 0%,#1a2034 70%);border-radius:12px;margin:14px 0;display:grid;place-items:center;overflow:hidden}.pose{width:100%;height:100%;object-fit:contain}.reversed .pose{transform:scaleX(-1)}.skill{min-height:24px;color:#e4d7a9;font-weight:700;margin-bottom:12px}.actions{display:flex;gap:8px}.actions button{flex:1;font-size:14px;white-space:nowrap;padding:10px 12px}#status{font-size:14px;color:#ccd1eb;min-height:20px}.voices{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.voices button{font-size:14px;background:#45405c;color:#fff}.empty{padding:40px;text-align:center}footer{padding:24px;color:#aeb4cf;text-align:center}@media(max-width:540px){#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.entry{padding:10px}.name{gap:6px}.name b{font-size:13px}.original{width:32px;height:32px}.stage{height:170px}.skill{font-size:12px}.actions{flex-direction:column}.actions button{font-size:13px}header,main{padding:20px 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><div class="eyebrow">LUNEKO CARD ARENA</div><h1>攻撃モーション図鑑</h1><p>キャラを選んで、そのキャラの攻撃を見よう。向きを変えると、敵側からの攻撃も見られます。</p><a href="./">ゲームを開く →</a><div class="controls"><input id="search" aria-label="キャラ名で検索" placeholder="キャラ名・技名で検索"><select id="element" aria-label="属性"><option value="">全属性</option><option value="flame">火焔</option><option value="ice">氷原</option><option value="nature">自然</option><option value="dark">暗黒</option><option value="rare">珍種</option></select></div><div id="status" role="status" aria-live="polite"></div><div class="voices"><button data-voice="beg-luna-taunt">ニャンルナの声</button><button data-voice="flame-2-taunt">ツキネコの声</button><button data-voice="mochi-fhe">モチの声</button></div></header><main><div id="grid"></div></main><footer>端末で動きを減らす設定を使っている場合は、攻撃の静止画を表示します。</footer>
<script>
const grid=document.querySelector('#grid'),status=document.querySelector('#status'),search=document.querySelector('#search'),element=document.querySelector('#element');
const names={flame:'火焔',ice:'氷原',nature:'自然',dark:'暗黒',rare:'珍種'};let catalog=[],currentAudio=null;
function render(){const term=search.value.trim().toLocaleLowerCase();const shown=catalog.filter(c=>(!element.value||c.specialty===element.value)&&(!term||[c.id,c.name,c.skill].join(' ').toLocaleLowerCase().includes(term)));grid.replaceChildren();status.textContent=shown.length+' / '+catalog.length+' 体';for(const c of shown){const card=document.createElement('article');card.className='entry';card.dataset.id=c.id;card.innerHTML='<div class="name"><img class="original" loading="lazy" alt=""><div><b></b><small></small></div></div><div class="stage"><img class="pose" loading="lazy" alt=""></div><div class="skill"></div><div class="actions"><button class="play">攻撃を見る</button><button class="secondary flip">向きを変える</button></div>';card.querySelector('b').textContent=c.name;card.querySelector('small').textContent=names[c.specialty]+' · '+c.level;card.querySelector('.original').src=c.art;card.querySelector('.skill').textContent=c.skill||'攻撃';const image=card.querySelector('.pose');image.src=c.poster;image.alt=c.name+'の攻撃';let timer;card.querySelector('.play').onclick=()=>{clearTimeout(timer);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;image.src=reduced?c.poster:c.src+'?play='+Date.now();status.textContent=c.name+'：'+(c.skill||'攻撃')+(reduced?'（静止画）':'');if(!reduced)timer=setTimeout(()=>image.src=c.poster,c.durationMs+160)};card.querySelector('.flip').onclick=()=>card.classList.toggle('reversed');grid.append(card)}if(!shown.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='見つかりませんでした。別の名前や属性で探してみてください。';grid.append(empty)}}
search.oninput=render;element.onchange=render;document.querySelectorAll('[data-voice]').forEach(button=>button.onclick=()=>{currentAudio?.pause();currentAudio=new Audio('./audio/voices/'+button.dataset.voice+'.wav');currentAudio.volume=.85;currentAudio.play().catch(()=>status.textContent='声を再生できませんでした。もう一度試してください。')});fetch('./attack-catalog.json').then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(data=>{catalog=data.map(c=>({...c,art:c.art.startsWith('/')?'.'+c.art:c.art,src:'.'+c.src,poster:'.'+c.poster}));render()}).catch(()=>status.textContent='図鑑を読み込めませんでした。ページを開き直してください。');
</script></html>
